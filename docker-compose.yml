services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savad-app
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=global-postgres
      - DB_PORT=5432
      - DB_DATABASE=savad
      - DB_USERNAME=admin
      - DB_PASSWORD=secret
    depends_on: []
    networks:
      - savad
      - global-network

  nginx:
    image: nginx:1.27-alpine
    container_name: savad-nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./.docker/vhost.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - savad

networks:
  savad:
    driver: bridge
  global-network:
    external: true
